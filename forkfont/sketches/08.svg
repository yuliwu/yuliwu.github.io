<title id="title">Cannes   Puiforcat - top-down study</title>
<desc id="desc">Four upright pieces, left to right: fork, knife, teaspoon, coffee spoon. Consistent orientation and spacing. Measured photo proportions with all interior marks clipped to their own object. Coffee spoon reconstructed by scaling the photographed larger spoon; it is absent from the source photo.</desc>
