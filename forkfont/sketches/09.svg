<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">Caccia   Alessi - top-down study</title>
<desc id="desc">Four upright pieces, left to right: fork, knife, teaspoon, coffee spoon. Consistent orientation and spacing. Measured photo proportions with all interior marks clipped to their own object.</desc>
<style>
svg { --plate:#fff; --edge:#4b5057; --mid:#7d848e; --lo:#adb3bb; --mark:#6b727b; --relief:#737c87; background:var(--plate) }
path { stroke-linecap:round; stroke-linejoin:round; vector-effect:non-scaling-stroke; stroke-width:.85 }
.sil { fill:var(--plate); stroke:var(--edge) }
.detail,.crease,.engraving { fill:none; stroke:var(--mid) }
.crease { stroke:var(--lo) }.engraving { stroke-width:.65 }
.hammer { fill:none; stroke:var(--lo); stroke-width:.65 }
.ornament { fill:none; stroke:var(--relief); stroke-width:.82 }
.ornament-fine { fill:none; stroke:var(--mid); stroke-width:.65 }
.mark { fill:var(--mark); stroke:none }
.stamp { fill:none; stroke:var(--mark); stroke-width:.32 }
.seam { fill:none; stroke:var(--edge); stroke-width:1.1 }


/* forkfont: heavier lines for the website */
path { stroke-width:1.02 }
.sil { stroke-width:1.61 }
.detail,.crease { stroke-width:1.02 }
.engraving,.hammer,.ornament-fine { stroke-width:0.78 }
.ornament { stroke-width:0.98 }
.stamp { stroke-width:0.38 }
.seam { stroke-width:2.09 }
</style>
<rect width="400" height="400" fill="var(--plate)"/>
